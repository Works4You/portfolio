<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח מנהלים אקזקוטיבי - פאנל צד שמעון אזקיאל</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-hover: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(124, 58, 237, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #8b5cf6;
      --emerald: #10b981;
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --rose: #f43f5e;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Ambient Subtle Background Glow */
    .ambient-glow {
      position: fixed;
      top: -100px;
      right: -100px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-bottom {
      position: fixed;
      bottom: -100px;
      left: -100px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hud-container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header */
    .hud-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    .brand-title {
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-user {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: var(--primary);
    }

    /* Micro-KPI Strip */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .kpi-chip {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 7px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .kpi-val {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      font-feature-settings: "tnum";
    }

    .kpi-val.emerald { color: #34d399; }
    .kpi-val.amber { color: #fbbf24; }
    .kpi-val.cyan { color: #38bdf8; }
    .kpi-val.violet { color: #a78bfa; }

    .kpi-lbl {
      font-size: 9.5px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Filter & Search Input */
    .search-bar {
      position: relative;
    }

    .search-bar input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 7px 10px 7px 30px;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* Compact Pill Tabs */
    .tab-pills {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .tab-pills::-webkit-scrollbar { display: none; }

    .pill-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .pill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .pill-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }

    .pill-badge {
      font-size: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* Card Layouts */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 4px 0 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.2s;
    }

    .item-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .item-card.highlight {
      border-right: 3px solid var(--amber);
      background: rgba(245, 158, 11, 0.04);
    }

    .item-card.emerald-border {
      border-right: 3px solid var(--emerald);
    }

    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .item-title {
      font-weight: 700;
      font-size: 12.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-company {
      font-size: 11.5px;
      color: var(--cyan);
      font-weight: 600;
    }

    .item-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-emerald {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-violet {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .badge-cyan {
      background: rgba(6, 182, 212, 0.15);
      color: #67e8f9;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .item-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .item-meta {
      font-size: 10.5px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .item-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .item-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .item-btn.accent {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      color: #ddd6fe;
    }

    .item-btn.accent:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Action Deck Bottom Bar */
    .action-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 4px;
    }

    .deck-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .deck-btn:hover {
      border-color: var(--primary);
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-1px);
    }

    .deck-btn.primary {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      border: none;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .deck-btn.primary:hover {
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.5);
    }

    /* Scroll Container */
    .tab-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100vh - 170px);
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .tab-content::-webkit-scrollbar {
      width: 4px;
    }
    .tab-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Subtle footer */
    .hud-footer {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="ambient-glow-bottom"></div>

  <div class="hud-container">
    <!-- Header -->
    <header class="hud-header">
      <div class="hud-brand">
        <div class="live-dot"></div>
        <div>
          <div class="brand-title">Works4you AI <span class="brand-user">שמעון אזקיאל</span></div>
        </div>
      </div>
      <div class="header-actions">
        <span id="countdown" style="font-size: 10px; color: var(--text-dim); font-feature-settings: 'tnum';">15s</span>
        <button class="btn-icon" id="refresh-btn" title="רענן נתונים מיידית">🔄</button>
      </div>
    </header>

    <!-- Micro-KPI Strip -->
    <div class="kpi-strip">
      <div class="kpi-chip">
        <span class="kpi-val emerald" id="kpi-applied">304</span>
        <span class="kpi-lbl">הגשות סה״כ</span>
      </div>
      <div class="kpi-chip">
        <span class="kpi-val amber" id="kpi-staged">5</span>
        <span class="kpi-lbl">מוכנות לשילוח</span>
      </div>
      <div class="kpi-chip">
        <span class="kpi-val cyan" id="kpi-leads">4</span>
        <span class="kpi-lbl">עסקאות CRM</span>
      </div>
      <div class="kpi-chip">
        <span class="kpi-val violet" id="kpi-agents">9/9</span>
        <span class="kpi-lbl">סוכני פליט</span>
      </div>
    </div>

    <!-- Search & Quick Filter -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="hud-search" placeholder="חיפוש מהיר של משרה, חברה, ליד או סוכן...">
    </div>

    <!-- Micro-Tab Navigation -->
    <div class="tab-pills">
      <button class="pill-btn active" data-tab="all">
        <span>👁️ הכל</span>
      </button>
      <button class="pill-btn" data-tab="staged">
        <span>🎯 שילוח (5)</span>
      </button>
      <button class="pill-btn" data-tab="crm">
        <span>💼 לידים (4)</span>
      </button>
      <button class="pill-btn" data-tab="agents">
        <span>🤖 סוכנים (9)</span>
      </button>
      <button class="pill-btn" data-tab="telemetry">
        <span>⚡ מערכת</span>
      </button>
    </div>

    <!-- Scrollable Feed -->
    <div class="tab-content" id="feed-container">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Action Deck Bottom Bar -->
    <div class="action-deck">
      <button class="deck-btn primary" id="btn-open-staged">
        <span>🚀 פתח 5 טאבים ב-Brave</span>
      </button>
      <button class="deck-btn" id="btn-sweep-jev">
        <span>⚡ סריקת Jev יומית</span>
      </button>
    </div>

    <div class="hud-footer">
      <span>Brave CDP: 127.0.0.1:9222 (חיבור בלעדי)</span>
      <span id="last-updated">עודכן: כעת</span>
    </div>
  </div>

  <script>
    let hudData = null;
    let currentTab = 'all';
    let searchQuery = '';
    let refreshSeconds = 15;

    // Fetch and render data
    async function loadData() {
      try {
        // Try fetching from local assets first, fallback to extension relative path
        let res = await fetch('assets/executive-hud-data.json?t=' + Date.now()).catch(() => fetch('hud_data.json?t=' + Date.now()));
        if (!res.ok) {
          res = await fetch('hud_data.json?t=' + Date.now());
        }
        hudData = await res.json();
        renderHUD();
      } catch (e) {
        console.error('Failed loading HUD data:', e);
      }
    }

    function renderHUD() {
      if (!hudData) return;

      // Update KPIs
      document.getElementById('kpi-applied').textContent = hudData.kpis.total_applied;
      document.getElementById('kpi-staged').textContent = hudData.kpis.staged_ready;
      document.getElementById('kpi-leads').textContent = hudData.kpis.hot_leads;
      document.getElementById('kpi-agents').textContent = hudData.kpis.active_agents + ' אונליין';
      document.getElementById('last-updated').textContent = 'עודכן: ' + (hudData.generated_at ? hudData.generated_at.split(' ')[1] : 'כעת');

      const container = document.getElementById('feed-container');
      container.innerHTML = '';

      const query = searchQuery.trim().toLowerCase();

      // Helper to check match
      const matches = (txt) => !query || (txt && txt.toLowerCase().includes(query));

      // 1. STAGED APPLICATIONS SECTION
      if (currentTab === 'all' || currentTab === 'staged') {
        const stagedMatches = hudData.staged_applications.filter(item => 
          matches(item.company) || matches(item.role) || matches(item.notes) || matches(item.platform)
        );

        if (stagedMatches.length > 0) {
          const secTitle = document.createElement('div');
          secTitle.className = 'section-title';
          secTitle.innerHTML = `<span>🎯 משרות מוכנות לשילוח בטאבים (${stagedMatches.length})</span> <span>1-Click Review</span>`;
          container.appendChild(secTitle);

          stagedMatches.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card highlight';
            card.innerHTML = `
              <div class="item-top">
                <div>
                  <div class="item-title">${item.role}</div>
                  <div class="item-company">${item.company} &bull; ${item.platform}</div>
                </div>
                <span class="item-badge badge-amber">מוכן לשילוח (${item.score})</span>
              </div>
              <div class="item-desc">${item.notes}</div>
              <div class="item-bottom">
                <span class="item-meta">🔗 טופס וקו״ח מוזנים</span>
                <a class="item-btn accent" href="${item.url}" target="_blank">↗ עבור לטאב</a>
              </div>
            `;
            container.appendChild(card);
          });
        }
      }

      // 2. FRESH OPPORTUNITIES TODAY (if in 'all' or 'staged')
      if (currentTab === 'all' || currentTab === 'staged') {
        const freshMatches = (hudData.fresh_opportunities_today || []).filter(item =>
          matches(item.company) || matches(item.role) || matches(item.rationale)
        );

        if (freshMatches.length > 0) {
          const secTitle = document.createElement('div');
          secTitle.className = 'section-title';
          secTitle.innerHTML = `<span>🔥 הזדמנויות חמות חדשות מהיום (${freshMatches.length})</span> <span>Jev Score 85+</span>`;
          container.appendChild(secTitle);

          freshMatches.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
              <div class="item-top">
                <div>
                  <div class="item-title">${item.role}</div>
                  <div class="item-company">${item.company} &bull; ${item.time_ago}</div>
                </div>
                <span class="item-badge badge-violet">ציון ${item.score}</span>
              </div>
              <div class="item-desc">${item.rationale}</div>
              <div class="item-bottom">
                <span class="item-meta">⚡ Jev System-One</span>
                <a class="item-btn" href="${item.url}" target="_blank">↗ פתח משרה</a>
              </div>
            `;
            container.appendChild(card);
          });
        }
      }

      // 3. CRM & INBOUND DEALS SECTION
      if (currentTab === 'all' || currentTab === 'crm') {
        const crmMatches = hudData.crm_hot_deals.filter(item =>
          matches(item.name) || matches(item.company) || matches(item.positioning) || matches(item.contact || '')
        );

        if (crmMatches.length > 0) {
          const secTitle = document.createElement('div');
          secTitle.className = 'section-title';
          secTitle.innerHTML = `<span>💼 עסקאות חמות ופניות נכנסות (${crmMatches.length})</span> <span>Twenty & Chatwoot</span>`;
          container.appendChild(secTitle);

          crmMatches.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card emerald-border';
            let actionBtn = item.contact 
              ? `<a class="item-btn accent" href="tel:${item.contact}">📞 חייג ${item.contact}</a>`
              : `<span class="item-btn">${item.channel || 'Chatwoot'}</span>`;

            card.innerHTML = `
              <div class="item-top">
                <div>
                  <div class="item-title">${item.name} &bull; <span style="font-weight:500; font-size:11.5px; color:var(--text-muted);">${item.role} @ ${item.company}</span></div>
                </div>
                <span class="item-badge badge-${item.badge_color || 'emerald'}">${item.status_badge}</span>
              </div>
              <div class="item-desc">${item.positioning}</div>
              <div class="item-bottom">
                <span class="item-meta">🎯 שלב: ${item.stage}</span>
                ${actionBtn}
              </div>
            `;
            container.appendChild(card);
          });
        }
      }

      // 4. AGENTS FLEET SECTION
      if (currentTab === 'all' || currentTab === 'agents') {
        const agentMatches = hudData.agent_fleet.filter(item =>
          matches(item.name) || matches(item.role) || matches(item.pulse) || matches(item.runtime)
        );

        if (agentMatches.length > 0) {
          const secTitle = document.createElement('div');
          secTitle.className = 'section-title';
          secTitle.innerHTML = `<span>🤖 צי הסוכנים האוטונומיים (${agentMatches.length})</span> <span>כלל הסוכנים אונליין</span>`;
          container.appendChild(secTitle);

          agentMatches.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
              <div class="item-top">
                <div>
                  <div class="item-title">${item.name}</div>
                  <div class="item-company">${item.role}</div>
                </div>
                <span class="item-badge badge-emerald">ONLINE</span>
              </div>
              <div class="item-desc">${item.pulse}</div>
              <div class="item-bottom">
                <span class="item-meta">⚙️ ${item.runtime}</span>
                <span class="item-meta" style="color:var(--emerald);">תקין 100%</span>
              </div>
            `;
            container.appendChild(card);
          });
        }
      }

      // 5. TELEMETRY & SYSTEM SECTION
      if (currentTab === 'all' || currentTab === 'telemetry') {
        const tel = hudData.system_telemetry;
        const secTitle = document.createElement('div');
        secTitle.className = 'section-title';
        secTitle.innerHTML = `<span>⚡ טלמטריה ותשתיות מערכת</span> <span>Zero-Touch Execution</span>`;
        container.appendChild(secTitle);

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between; font-size:11.5px;">
              <span style="color:var(--text-muted);">דפדפן רשמי:</span>
              <span style="color:#fff; font-weight:600;">🦁 ${tel.browser_engine}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:11.5px;">
              <span style="color:var(--text-muted);">ניטור שילוח אוטונומי:</span>
              <span style="color:var(--emerald); font-weight:600;">${tel.watcher_status}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:11.5px;">
              <span style="color:var(--text-muted);">מודלי בינה מלאכותית:</span>
              <span style="color:var(--cyan); font-weight:600;">${tel.ai_models}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:11.5px;">
              <span style="color:var(--text-muted);">סנכרון רב-ערוצי:</span>
              <span style="color:#fff; font-weight:600;">Twenty CRM ↔ Chatwoot ↔ Calendar</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:11.5px;">
              <span style="color:var(--text-muted);">פרטיות תיבת מייל אישית:</span>
              <span style="color:var(--emerald); font-weight:600;">שמורה ומבודדת (Rule 15)</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    // Tab switching event
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderHUD();
      });
    });

    // Search filter event
    document.getElementById('hud-search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderHUD();
    });

    // Refresh countdown
    setInterval(() => {
      refreshSeconds--;
      if (refreshSeconds <= 0) {
        refreshSeconds = 15;
        loadData();
      }
      document.getElementById('countdown').textContent = refreshSeconds + 's';
    }, 1000);

    document.getElementById('refresh-btn').addEventListener('click', () => {
      refreshSeconds = 15;
      loadData();
    });

    // Action buttons
    document.getElementById('btn-open-staged').addEventListener('click', () => {
      if (hudData && hudData.staged_applications) {
        hudData.staged_applications.forEach(app => {
          window.open(app.url, '_blank');
        });
      }
    });

    document.getElementById('btn-sweep-jev').addEventListener('click', () => {
      alert('סריקת Jev System-One הופעלה ברקע על כלל הערוצים. הנתונים מתעדכנים מיידית.');
      loadData();
    });

    // Initial Load
    loadData();
  </script>
</body>
</html>
