<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Face Gradient: Warm Coral Amber -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5E36" />
    </linearGradient>

    <!-- Left Face Gradient: Vivid Magenta Pink -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1E6A" />
      <stop offset="100%" stop-color="#C2004D" />
    </linearGradient>

    <!-- Right Face Gradient: Royal Purple / Violet -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadow3d)">
    <!-- ================= CHEVRON 1 (LEFT) ================= -->
    <g id="chevron-1" transform="translate(40, 20)">
      <!-- Left Vertical Faces (Magenta) -->
      <polygon points="50,110 50,170 120,210 120,150" fill="url(#leftGrad)" />
      <polygon points="50,110 50,170 10,147 10,87" fill="#E60050" />

      <!-- Right / Under Vertical Faces (Purple) -->
      <polygon points="120,150 120,210 170,181 170,121" fill="url(#rightGrad)" />
      <polygon points="100,80 100,140 170,181 170,121" fill="#4C1D95" />

      <!-- Top Face (Warm Coral Orange) -->
      <polygon points="100,80 170,121 120,150 50,110 10,87 60,58" fill="url(#topGrad)" stroke="#FFA057" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- ================= CHEVRON 2 (RIGHT) ================= -->
    <g id="chevron-2" transform="translate(160, 20)">
      <!-- Left Vertical Faces (Magenta) -->
      <polygon points="50,110 50,170 120,210 120,150" fill="url(#leftGrad)" />
      <polygon points="50,110 50,170 10,147 10,87" fill="#E60050" />

      <!-- Right / Under Vertical Faces (Purple) -->
      <polygon points="120,150 120,210 170,181 170,121" fill="url(#rightGrad)" />
      <polygon points="100,80 100,140 170,181 170,121" fill="#4C1D95" />

      <!-- Top Face (Warm Coral Orange) -->
      <polygon points="100,80 170,121 120,150 50,110 10,87 60,58" fill="url(#topGrad)" stroke="#FFA057" stroke-width="1.5" stroke-linejoin="round" />
    </g>
  </g>
</svg>
