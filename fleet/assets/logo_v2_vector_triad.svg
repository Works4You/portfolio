<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A" />
      <stop offset="100%" stop-color="#D9005B" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <filter id="triadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#triadGlow)" transform="translate(160, 160)">
    <!-- Central Core Glow -->
    <circle cx="0" cy="0" r="42" fill="url(#coreGlow)" />

    <!-- Central Floating Diamond/Cube -->
    <polygon points="0,-16 14,-8 0,0 -14,-8" fill="#FFFFFF" />
    <polygon points="-14,-8 0,0 0,16 -14,8" fill="#A5F3FC" />
    <polygon points="0,0 14,-8 14,8 0,16" fill="#38BDF8" />

    <!-- ================= TOP BLOCK (AMBER) ================= -->
    <g transform="translate(0, -68)">
      <!-- Top Face -->
      <polygon points="0,-36 42,-12 0,12 -42,-12" fill="url(#amberGrad)" stroke="#FFA057" stroke-width="1.2" stroke-linejoin="round" />
      <!-- Left Face -->
      <polygon points="-42,-12 0,12 0,38 -42,14" fill="#FF5E36" />
      <!-- Right Face -->
      <polygon points="0,12 42,-12 42,14 0,38" fill="#E65100" />
      <!-- Inner Notch Seams -->
      <polygon points="0,12 18,2 0,-8 -18,2" fill="#D9480F" opacity="0.6"/>
    </g>

    <!-- ================= BOTTOM-LEFT BLOCK (MAGENTA) ================= -->
    <g transform="translate(-60, 36)">
      <!-- Top Face -->
      <polygon points="0,-24 32,-6 0,12 -32,-6" fill="#FF5E8A" stroke="#FF7597" stroke-width="1.2" stroke-linejoin="round" />
      <!-- Left Face -->
      <polygon points="-32,-6 0,12 0,52 -32,34" fill="url(#magentaGrad)" />
      <!-- Right Face -->
      <polygon points="0,12 32,-6 32,34 0,52" fill="#A20042" />
    </g>

    <!-- ================= BOTTOM-RIGHT BLOCK (ROYAL PURPLE) ================= -->
    <g transform="translate(60, 36)">
      <!-- Top Face -->
      <polygon points="0,-24 32,-6 0,12 -32,-6" fill="#A78BFA" stroke="#C4B5FD" stroke-width="1.2" stroke-linejoin="round" />
      <!-- Left Face -->
      <polygon points="-32,-6 0,12 0,52 -32,34" fill="#6D28D9" />
      <!-- Right Face -->
      <polygon points="0,12 32,-6 32,34 0,52" fill="url(#purpleGrad)" />
    </g>
  </g>
</svg>
