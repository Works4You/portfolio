<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="loopGradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="loopGradMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A" />
      <stop offset="100%" stop-color="#D9005B" />
    </linearGradient>
    <linearGradient id="loopGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <!-- Soft 3D drop shadow -->
    <filter id="loopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#loopShadow)" transform="translate(180, 110)">
    <!-- Central Core Energy Glow -->
    <circle cx="0" cy="0" r="32" fill="url(#centerGlow)" />

    <!-- Under Loop (Royal Purple / Violet) -->
    <path d="M-85,-48 C-135,-48 -160,-15 -160,20 C-160,55 -130,85 -85,85 C-45,85 -15,45 0,0 C15,-45 45,-85 85,-85 C130,-85 160,-55 160,-20 C160,15 135,48 85,48 C45,48 15,15 0,0" 
          stroke="url(#loopGradPurple)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Overlapping Front Loop (Solar Amber & Magenta) -->
    <path d="M-85,-48 C-45,-48 -15,-15 0,0 C15,15 45,48 85,48 C130,48 160,20 160,-20 C160,-55 130,-85 85,-85" 
          stroke="url(#loopGradAmber)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M-85,85 C-130,85 -160,55 -160,20 C-160,-15 -135,-48 -85,-48 C-60,-48 -35,-30 -15,-10" 
          stroke="url(#loopGradMagenta)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interior Highlight Sheen -->
    <path d="M-85,-40 C-125,-40 -148,-12 -148,16 C-148,46 -122,72 -85,72 C-50,72 -24,38 -10,-2" 
          stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" />
    <path d="M85,-72 C122,-72 148,-46 148,-16 C148,12 125,40 85,40 C50,40 24,12 10,-2" 
          stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
