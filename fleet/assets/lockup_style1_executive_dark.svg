<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="numGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF1E6A" />
    </linearGradient>
    <linearGradient id="aiBadgeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
    .text-brand-dark { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 50px; font-weight: 800; letter-spacing: -0.035em; fill: #FFFFFF; }
    .text-num-dark { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 52px; font-weight: 900; fill: url(#numGradDark); }
    .text-sub-dark { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.18em; fill: #94A3B8; text-transform: uppercase; }
  </style>
  <g transform="translate(10, 16)">
    <image href="logo_brand_primary_tight.png" x="0" y="4" width="120" height="80" preserveAspectRatio="xMidYMid meet" />
    <g transform="translate(140, 20)">
      <text x="0" y="38" class="text-brand-dark">Works<tspan class="text-num-dark">4</tspan>you</text>
      <!-- AI Badge -->
      <g transform="translate(285, 8)" filter="url(#glowDark)">
        <rect width="70" height="36" rx="10" fill="url(#aiBadgeGradDark)" />
        <circle cx="16" cy="18" r="3.5" fill="#FFFFFF" />
        <text x="32" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.04em">AI</text>
      </g>
      <text x="2" y="62" class="text-sub-dark">Autonomous Enterprise Fleet</text>
    </g>
  </g>
</svg>